# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main, develop, 'release/.*', 'hotfix/.*']
  path_filters:
    - '!package-lock.json'
    - '!services/api/uv.lock'
    - '!contracts/telemetry-v1.schema.json'
    - '!docs/project-brief.md'
  path_instructions:
    - path: 'services/api/**'
      instructions: >
        Check tenant isolation, finite W/Wh values, UTC timestamps, idempotency,
        query bounds and consistency between SQLAlchemy and Alembic.
        Never treat MQTT delivery as physical acknowledgement.
    - path: 'apps/web/**'
      instructions: >
        Check Server/Client boundaries, accessible loading/error/stale states,
        reconnect cleanup and unit labels. Never expose backend secrets or MQTT
        credentials in the client bundle.
    - path: '.github/workflows/**'
      instructions: >
        Keep PR CI free of cloud secrets and hosted migrations.
        Use minimal token permissions and cover GitFlow branches.
chat:
  auto_reply: true
