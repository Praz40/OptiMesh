[project]
name = "optimesh-api"
version = "0.1.0"
description = "OptiMesh API and PostgreSQL persistence foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pyjwt[crypto]>=2.10,<3",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "pyyaml>=6,<7",
  "jsonschema>=4,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
