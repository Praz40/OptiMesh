name: Set up GitHub project
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: github-project-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create labels, milestones and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/setup_github.py --repo "${{ github.repository }}"
